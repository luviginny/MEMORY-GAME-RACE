<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Live Leaderboard</title><link rel="stylesheet" href="style.css"></head><body><header><b>🏆 LIVE LEADERBOARD</b><a href="index.html">🧠 PLAY GAME</a></header><main><section class="card"><h1>🏆 Memory Race Leaderboard</h1><p id="status">Connecting...</p><table><thead><tr><th>Rank</th><th>Player</th><th>Score</th><th>Time</th><th>Mistakes</th></tr></thead><tbody id="rows"></tbody></table></section></main>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script><script src="firebase-config.js"></script><script>
if(window.FIREBASE_CONFIG.apiKey==="PASTE_YOUR_API_KEY_HERE"){status.textContent="Firebase is not configured. Follow SETUP.txt."}else{firebase.initializeApp(window.FIREBASE_CONFIG);firebase.database().ref("scores").on("value",snap=>{let a=[];snap.forEach(c=>a.push(c.val()));a.sort((x,y)=>(y.score||0)-(x.score||0)||(x.time||999)-(y.time||999));rows.innerHTML=a.slice(0,100).map((x,i)=>`<tr><td>${i<3?["🥇","🥈","🥉"][i]:i+1}</td><td>${esc(x.name||"Player")}</td><td><b>${Number(x.score||0).toLocaleString()}</b></td><td>${Number(x.time||0).toFixed(1)}s</td><td>${x.mistakes||0}</td></tr>`).join("");status.textContent="🟢 LIVE · "+a.length+" scores";})}function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]))}
</script></body></html>
