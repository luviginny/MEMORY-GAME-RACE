<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mental Memory Race</title><link rel="stylesheet" href="style.css"></head><body>
<header><b>🧠 MEMORY RACE</b><a href="leaderboard.html">🏆 LIVE LEADERBOARD</a></header>
<main>
<section id="start" class="card center"><div class="emoji">🧠</div><h1>Mental Memory Race</h1><p>Match all 8 pairs as fast as possible. Faster + fewer mistakes = higher score.</p><input id="name" maxlength="20" placeholder="Enter player name"><button onclick="start()">START GAME</button><p id="err"></p></section>
<section id="game" class="card" hidden><div class="stats">Player: <b id="player"></b> · Time: <b id="time">0.0</b>s · Mistakes: <b id="mistakes">0</b> · Matches: <b id="matches">0</b>/8 · Score: <b id="score">10000</b></div><div id="board"></div></section>
<section id="result" class="card center" hidden><div class="emoji">🏆</div><h2>Game Complete!</h2><h3 id="resultName"></h3><div id="finalScore"></div><p id="details"></p><p id="save"></p><button onclick="location.reload()">PLAY AGAIN</button><a href="leaderboard.html">VIEW LIVE LEADERBOARD</a></section>
</main>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script><script src="firebase-config.js"></script>
<script>
const symbols=["🍎","🚀","⭐","🐼","🌈","⚽","🎵","🦋"];let deck=[],first=null,second=null,lock=false,matched=0,mistakes=0,started=0,timer=null,name="";
const configured=window.FIREBASE_CONFIG.apiKey!=="PASTE_YOUR_API_KEY_HERE";if(configured){firebase.initializeApp(window.FIREBASE_CONFIG);var db=firebase.database();}
function score(t,e){return Math.max(100,10000-Math.floor(t*10)-e*100)}
function start(){name=document.getElementById("name").value.trim();if(!name){document.getElementById("err").textContent="Enter a player name.";return}document.getElementById("start").hidden=true;document.getElementById("game").hidden=false;document.getElementById("player").textContent=name;matched=0;mistakes=0;first=second=null;started=performance.now();makeDeck();clearInterval(timer);timer=setInterval(tick,100)}
function tick(){let t=(performance.now()-started)/1000;document.getElementById("time").textContent=t.toFixed(1);document.getElementById("score").textContent=score(t,mistakes)}
function makeDeck(){deck=[...symbols,...symbols].sort(()=>Math.random()-.5);let b=document.getElementById("board");b.innerHTML="";deck.forEach((s,i)=>{let x=document.createElement("button");x.className="cardx";x.innerHTML='<span class="inner"><span class="front">?</span><span class="back">'+s+'</span></span>';x.onclick=()=>flip(i,x);b.appendChild(x)})}
function flip(i,el){if(lock||el.classList.contains("flip")||el.classList.contains("matched"))return;el.classList.add("flip");if(first===null){first={i,el};return}second={i,el};lock=true;if(deck[first.i]===deck[second.i]){first.el.classList.add("matched");second.el.classList.add("matched");matched++;document.getElementById("matches").textContent=matched;first=second=null;lock=false;if(matched===8)finish()}else{mistakes++;document.getElementById("mistakes").textContent=mistakes;setTimeout(()=>{first.el.classList.remove("flip");second.el.classList.remove("flip");first=second=null;lock=false},650)}}
async function finish(){clearInterval(timer);let t=(performance.now()-started)/1000,s=score(t,mistakes);document.getElementById("game").hidden=true;document.getElementById("result").hidden=false;document.getElementById("resultName").textContent=name;document.getElementById("finalScore").textContent=s.toLocaleString()+" POINTS";document.getElementById("details").textContent=`Time: ${t.toFixed(1)}s · Mistakes: ${mistakes}`;if(!configured){document.getElementById("save").textContent="Firebase is not configured. Follow SETUP.txt to enable live scoring.";return}try{await db.ref("scores").push({name,score:s,time:Number(t.toFixed(1)),mistakes,createdAt:firebase.database.ServerValue.TIMESTAMP});document.getElementById("save").textContent="✅ Score saved to the live leaderboard!"}catch(e){document.getElementById("save").textContent="⚠️ Could not save score. Check Firebase setup."}}
</script></body></html>
